<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0a;--fg:#f5f5f4;--muted:#9c9c97;--accent:#e8ad46;--hair:rgba(255,255,255,0.13);--card:#141413;--dead:#6b6b68;--good:#5ac27a}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
  body{font-family:Inter,system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:1080px;height:1920px}
  .l{position:absolute;left:80px;right:80px}
  .mono{font-family:"JetBrains Mono",monospace}
  .big{font-size:78px;line-height:1.14;font-weight:700;letter-spacing:-.02em}
  .mid{font-size:50px;line-height:1.26;font-weight:600;letter-spacing:-.01em}
  .note{font-size:38px;line-height:1.4;color:var(--muted)}
  .card{position:absolute;left:80px;right:80px;background:var(--card);
        border:1px solid var(--hair);border-radius:22px;padding:40px 44px}
  .repo{font-size:46px;font-weight:700;letter-spacing:-.01em}
  .desc{font-size:34px;color:var(--muted);margin-top:14px;line-height:1.35}
  .meta{font-size:34px;color:var(--muted);margin-top:26px;display:flex;gap:40px}
  .fail{font-size:40px;font-weight:600;line-height:1.3}
  .failsub{font-size:34px;color:var(--dead)}
  .cap{position:absolute;left:80px;right:80px;bottom:150px;text-align:center;
       font-size:46px;line-height:1.3;font-weight:600}
  .wm{position:absolute;left:0;right:0;bottom:70px;text-align:center;
      font-size:30px;color:var(--muted);letter-spacing:.14em;font-weight:500}
  .badge{display:inline-block;font-size:28px;font-weight:600;padding:8px 20px;
         border-radius:999px;background:rgba(232,173,70,.16);color:var(--accent)}
</style></head><body><div id="stage"></div>
<script>
const F=window.__FACTS__||{};
const S=document.getElementById("stage");
function add(cls,html,y){const d=document.createElement("div");d.className="l "+cls;
  d.innerHTML=html;d.style.top=y+"px";S.appendChild(d);return d;}
function cap(t){const d=document.createElement("div");d.className="cap";d.textContent=t;S.appendChild(d);}
// The repo is `you/parser-kit` on purpose: an obvious placeholder, never a real
// person's project dressed up as a case study.
function repoCard(y,{stars,forks,watch,push,dim,top,timer}){
  const c=document.createElement("div");c.className="card";c.style.top=y+"px";
  if(top)c.style.borderColor="var(--accent)";
  c.innerHTML=
    (top?'<div style="margin-bottom:22px"><span class="badge">TOP OF FEED · '+timer+' LEFT</span></div>':'')+
    '<div class="repo mono">you/parser-kit</div>'+
    '<div class="desc">A tolerant parser for messy CSV. 400 lines, no deps.</div>'+
    '<div class="meta mono">'+
      '<span style="color:'+(dim?'var(--dead)':'var(--accent)')+'">★ '+stars+'</span>'+
      '<span>⑂ '+forks+'</span><span>👁 '+watch+'</span></div>'+
    '<div class="meta mono" style="margin-top:14px;color:var(--dead)">'+push+'</div>';
  S.appendChild(c);return c;
}
const SCENES={
 1:()=>{repoCard(620,{stars:3,forks:0,watch:0,push:"last push · 8 months ago",dim:1});
        add("big","This is a good library.",1120);cap("This is a good library.");},
 2:()=>{repoCard(560,{stars:3,forks:0,watch:0,push:"last push · 8 months ago",dim:1});
        add("big",'<span style="color:var(--accent)">Three people</span> know it exists.',1060);
        cap("Three people know it exists.");},
 3:()=>{add("mid","You did try.",560);
        add("fail",'Posted to r/programming<br><span class="failsub">4am your timezone · 2 upvotes</span>',700);
        add("fail",'Posted to Hacker News<br><span class="failsub">page 4 in nine minutes</span>',880);
        add("fail",'Tweeted it<br><span class="failsub">your 11 followers saw it</span>',1060);
        cap("You did try.");},
 4:()=>{add("big","Not one of those asked whether the code was any good.",600);
        add("big",'<span style="color:var(--accent)">They asked who you already know.</span>',1000);
        cap("They asked who you already know.");},
 5:()=>{add("mid","Same repo. Same code. Same three stars.",520);
        repoCard(660,{stars:3,forks:0,watch:0,push:"listed 2 minutes ago",top:1,timer:"58:12"});
        cap("Same repo. Same code.");},
 6:()=>{add("big","You starred six repos you actually liked.",560);
        add("mid",'That is <span style="color:var(--accent)">'+F.dailyCap+' credits</span>. One credit buys '
          +F.selfMinutes+' minutes up there.',960);
        add("note","Verified against GitHub with your own token.",1180);
        cap("Six stars. Six credits.");},
 7:()=>{add("big","Unstar them next week?",560);
        add("mid",'The credit comes <span style="color:var(--accent)">back off you</span>. Your balance can go negative.',900);
        add("note","A job re-asks GitHub every night, for 100 days.",1160);
        cap("The credit comes back off you.");},
 8:()=>{add("big","The price of being seen here is looking at someone else's work first.",600);
        add("mid",'<span style="color:var(--accent)">repoherald</span>',1120);
        cap("That's the whole trade.");}
};
window.renderScene=function(n){S.innerHTML="";SCENES[n]();
  const w=document.createElement("div");w.className="wm";w.textContent="REPOHERALD";S.appendChild(w);};
window.renderScene(1);
</script></body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* repoherald's real dark palette, from src/components/landing/landing-v2.css */
  :root{--bg:#0a0a0a;--fg:#f5f5f4;--muted:#9c9c97;--accent:#e8ad46;--hair:rgba(255,255,255,0.13);--card:#141413}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:var(--bg);overflow:hidden}
  body{font-family:Inter,system-ui,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:1080px;height:1920px}
  .l{position:absolute;left:80px;right:80px;will-change:opacity,transform}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  .hook{font-size:86px;line-height:1.12;font-weight:700;letter-spacing:-.02em}
  .sub{font-size:44px;line-height:1.3;color:var(--muted);font-weight:500}
  .term{font-size:52px;font-weight:700;letter-spacing:-.01em}
  .note{font-size:40px;line-height:1.4;color:var(--muted)}
  .proof{font-size:46px;font-weight:700}
  .killed{font-size:56px;font-weight:600;color:var(--muted)}
  .cap{position:absolute;left:80px;right:80px;bottom:150px;text-align:center;
       font-size:46px;line-height:1.3;font-weight:600;letter-spacing:-.01em}
  .wm{position:absolute;left:0;right:0;bottom:70px;text-align:center;
      font-size:30px;color:var(--muted);letter-spacing:.14em;font-weight:500}
  .rule{position:absolute;height:1px;background:var(--hair)}
</style></head>
<body><div id="stage"></div>
<script>
const F = window.__FACTS__ || {};
const S = document.getElementById("stage");
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
// easeOutCubic — settle fast, hold still. Readability over flourish.
const ease=t=>1-Math.pow(1-clamp(t,0,1),3);
// fade in over `d`, hold, fade out in the last 0.35s before `out`
function amp(t,inAt,out,d=0.45){
  if(t<inAt||t>out)return 0;
  const a=ease((t-inAt)/d);
  const b=1-ease((t-(out-0.35))/0.35);
  return Math.min(a,Math.max(0,b));
}
function el(cls,html,y,a,dy=28){
  const d=document.createElement("div");
  d.className="l "+cls; d.innerHTML=html;
  d.style.top=y+"px"; d.style.opacity=a;
  d.style.transform="translateY("+((1-a)*dy).toFixed(2)+"px)";
  S.appendChild(d); return d;
}
const CAPS=[
 [0.0,2.1,"No platform will ever show you"],[2.1,3.0,"the formula that decides what you see."],
 [3.0,4.6,"Here's mine."],[4.6,6.4,"Not a description of it."],[6.4,8.0,"The actual line."],
 [8.2,10.2,"Score equals log of one plus stars —"],[10.2,11.8,"so going from ten to twenty matters,"],
 [11.8,13.6,"from a thousand to a thousand and ten, it doesn't."],
 [13.8,15.6,"Minus age in hours over forty-eight."],[15.6,17.8,"Everything decays. Nothing is permanently at the top."],
 [17.8,20.2,"Plus a hundred, times the minutes of highlight left,"],[20.2,21.6,"over sixty."],
 [21.6,23.8,"That's the part you buy with a credit."],
 [24.0,25.0,"That's it."],[25.0,26.2,"Likes aren't in it."],[26.2,27.2,"Comments aren't in it."],
 [27.2,28.4,"Who you follow isn't in it."],
 [28.6,30.6,"Every value in that line is something a person did on purpose."],
 [30.8,32.0,"Save this."]
];
function termHTML(active){
  const c=i=>i===active?"color:var(--accent)":(active>=0?"color:var(--muted)":"color:var(--fg)");
  return '<span style="'+c(0)+'">ln(1 + stars)</span><br>'
       + '<span style="'+c(1)+'">− age_hours / '+F.decayHours+'</span><br>'
       + '<span style="'+c(2)+'">+ '+F.boostMult+' × minutes / '+F.boostDiv+'</span>';
}
window.renderFrame=function(t){
  S.innerHTML="";
  // ---- HOOK 0–4.6
  let a=amp(t,0.15,4.4,.5);
  if(a>0) el("hook","No platform will ever show you the formula that decides what you see.",660,a);
  a=amp(t,2.9,4.6,.4);
  if(a>0) el("hook",'<span style="color:var(--accent)">Here\'s mine.</span>',1100,a);
  // ---- BUILD 4.8–8
  a=amp(t,4.25,8.0,.4);
  if(a>0) el("sub","Not a description of it. The actual line.",820,a);
  // ---- FORMULA, present 7.4 → 28.4, highlighted term by term
  a=amp(t,7.4,28.4,.5);
  if(a>0){
    const active = t<8.2?-1 : t<13.6?0 : t<17.8?1 : t<23.8?2 : -1;
    const f=el("term mono",termHTML(active),720,a,20);
    f.style.lineHeight="1.9";
  }
  // ---- TERM 1 proof 9.6–13.6
  a=amp(t,9.6,13.6,.4);
  if(a>0){
    el("proof mono",'10 → 20<span style="color:var(--accent)">&nbsp;&nbsp;+'+F.lnSmall+'</span>',1080,a);
    el("proof mono",'1,000 → 1,010<span style="color:var(--muted)">&nbsp;&nbsp;+'+F.lnLarge+'</span>',1160,a);
    el("note","Early stars move you. Late ones barely do.",1280,a);
  }
  // ---- TERM 2 decay 14.4–17.8
  a=amp(t,14.4,17.8,.4);
  if(a>0){
    el("note","Posted 48 hours ago? You've lost a full point.<br>Nothing sits at the top for free.",1090,a);
  }
  // ---- TERM 3 countdown 19.0–23.8
  a=amp(t,19.0,23.8,.4);
  if(a>0){
    const p=clamp((t-19.0)/4.0,0,1);
    const mins=Math.round(F.selfMinutes*(1-p));
    const boost=(F.boostMult*mins/F.boostDiv).toFixed(1);
    el("proof mono",'minutes left&nbsp;&nbsp;<span style="color:var(--accent)">'+mins+'</span>',1080,a);
    el("proof mono",'boost&nbsp;&nbsp;<span style="color:var(--accent)">+'+boost+'</span>',1160,a);
    el("note","One credit. "+F.selfMinutes+" minutes. Then it's gone.",1280,a);
  }
  // ---- NOT IN IT 24.6–28.4
  const kills=[["Likes",24.9],["Comments",26.0],["Follows",27.1]];
  kills.forEach(([w,at],i)=>{
    const k=amp(t,at,28.4,.35);
    if(k>0){
      const e=el("killed",w,1060+i*100,k,16);
      const strike=clamp((t-at-0.15)/0.4,0,1);
      const r=document.createElement("div");
      r.className="rule";
      r.style.cssText="left:80px;height:4px;top:"+(1060+i*100+36)+"px;width:"+(strike*(w.length*31+10))+"px;background:var(--accent);opacity:"+k;
      S.appendChild(r);
    }
  });
  // ---- PAYOFF + CTA 28.6–32
  a=amp(t,28.25,30.8,.4);
  if(a>0) el("hook","Every value in that line is something a person did on purpose.",680,a);
  a=amp(t,30.7,32.0,.35);
  if(a>0) el("hook",'<span style="color:var(--accent)">Save this.</span>',1020,a);
  // ---- captions
  const bigText = (t<4.6)||(t>=28.25);
  const c=bigText?null:CAPS.find(([s,e])=>t>=s&&t<e);
  if(c){const d=document.createElement("div");d.className="cap";d.textContent=c[2];S.appendChild(d);}
  // ---- wordmark
  const w=document.createElement("div");w.className="wm";w.textContent="REPOHERALD";
  w.style.opacity=amp(t,0.6,32.0,1.2);S.appendChild(w);
};
window.renderFrame(0);
</script></body></html>

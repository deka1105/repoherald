      "#id-type",

    // Word by word, no translate. Settled 2.33-5.45 = 3.12s for eight words

      "#id-repair .id-w",
      { opacity: 0, filter: "blur(7px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power4.out", stagger: 0.07 },

    // Blur swap into scene 4: the ground never cuts. Lands at 5.44.

      { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" },
